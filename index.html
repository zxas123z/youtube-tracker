<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube 播放量追蹤器</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary-color: #ff0000;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e9ecef;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    .card h2 {
      margin-top: 0;
      font-size: 1.25rem;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="text"], input[type="password"], select {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #cc0000;
    }

    button.btn-secondary {
      background-color: #6c757d;
    }

    button.btn-secondary:hover {
      background-color: #5a6268;
    }

    button.btn-danger {
      background-color: #dc3545;
    }

    button.btn-danger:hover {
      background-color: #bd2130;
    }

    .help-text {
      font-size: 12px;
      color: #6c757d;
      margin-top: 5px;
    }

    .controls-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .status-bar {
      font-size: 13px;
      color: #6c757d;
      margin-bottom: 15px;
      padding: 8px 12px;
      background-color: #e9ecef;
      border-radius: 4px;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-card {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 8px;
      background-color: #fff;
    }

    .item-info {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      flex: 1;
    }

    .item-info img {
      width: 100px;
      height: 75px;
      border-radius: 6px;
      object-fit: cover;
    }

    .item-details {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .item-title {
      font-weight: 600;
      text-decoration: none;
      color: var(--text-color);
      font-size: 16px;
    }

    .item-title:hover {
      color: var(--primary-color);
    }

    .channel-name {
      font-size: 13px;
      color: #495057;
      font-weight: 500;
    }

    .item-meta {
      font-size: 12px;
      color: #6c757d;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stats-badge-container {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .badge {
      background-color: #f1f3f5;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: #333;
    }

    .badge-highlight {
      background-color: #e7f5ff;
      color: #1971c2;
      font-weight: 600;
    }

    .chart-container {
      position: relative;
      height: 350px;
      margin-top: 20px;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      margin-left: 12px;
    }

    .export-import-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .analytics-box {
      background-color: #f1f3f5;
      padding: 15px;
      border-radius: 6px;
      border-left: 4px solid var(--primary-color);
    }

    .analytics-box .title {
      font-size: 12px;
      color: #6c757d;
      margin-bottom: 5px;
    }

    .analytics-box .value {
      font-size: 18px;
      font-weight: bold;
      color: var(--text-color);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>YouTube 播放量追蹤器</h1>

  <!-- API Key 設定 -->
  <div class="card">
    <h2>1. API Key 設定</h2>
    <div class="input-group">
      <input type="password" id="apiKeyInput" placeholder="請輸入 YouTube Data API v3 Key">
      <button onclick="saveApiKey()">儲存 Key</button>
    </div>
    <div class="help-text">API Key 將會安全地儲存於您的瀏覽器本地（localStorage）中。</div>
  </div>

  <!-- 新增追蹤項目 -->
  <div class="card">
    <h2>2. 新增追蹤項目</h2>
    <div class="input-group">
      <input type="text" id="targetInput" placeholder="輸入 YouTube 影片網址或 ID (例如: https://www.youtube.com/watch?v=dQw4w9WgXcQ)">
      <button onclick="addTrackItem()">查詢並追蹤</button>
    </div>
  </div>

  <!-- 已追蹤列表 -->
  <div class="card">
    <div class="controls-header">
      <h2 style="margin: 0; border: none; padding: 0;">3. 已追蹤列表</h2>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button class="btn-secondary" onclick="manualRefreshAll()">手動即時更新</button>
        <label for="sortSelect" style="font-size: 14px; font-weight: bold;">排序方式：</label>
        <select id="sortSelect" onchange="renderList()" style="width: auto; display: inline-block;">
          <option value="default">預設（區域順序）</option>
          <option value="views-desc">播放量：高至低</option>
          <option value="views-asc">播放量：低至高</option>
          <option value="title-asc">標題：A 至 Z</option>
        </select>
      </div>
    </div>
    <div class="status-bar" id="statusBar">自動更新狀態：準備中（每 10 分鐘自動刷新）</div>
    <div id="trackList" class="item-list"></div>

    <div class="export-import-group">
      <button class="btn-secondary" onclick="exportData('json')">匯出 JSON</button>
      <button class="btn-secondary" onclick="exportData('csv')">匯出 CSV</button>
      <button class="btn-secondary" onclick="document.getElementById('importFileInput').click()">匯入 JSON</button>
      <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importData(event)">
    </div>
  </div>

  <!-- 數據圖表與統計分析 -->
  <div class="card">
    <h2>4. 播放量變化圖表與數據分析</h2>
    <div class="input-group">
      <select id="chartItemSelect" onchange="updateChartAndAnalytics()">
        <option value="ALL">顯示所有項目</option>
      </select>
    </div>
    
    <!-- 數據分析儀表板 -->
    <div class="analytics-grid" id="analyticsDashboard">
      <div class="analytics-box">
        <div class="title">總追蹤項目</div>
        <div class="value" id="statTotalItems">0</div>
      </div>
      <div class="analytics-box">
        <div class="title">總播放量</div>
        <div class="value" id="statTotalViews">0</div>
      </div>
      <div class="analytics-box">
        <div class="title">近一小時平均增長</div>
        <div class="value" id="statHourlyGrowth">0 / hr</div>
      </div>
      <div class="analytics-box">
        <div class="title">最高播放量項目</div>
        <div class="value" id="statTopItem">-</div>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="viewsChart"></canvas>
    </div>
  </div>
</div>

<script>
  let trackedItems = JSON.parse(localStorage.getItem('trackedItems') || '[]');
  let chartInstance = null;
  const AUTO_REFRESH_INTERVAL = 10 * 60 * 1000;

  const CHART_COLORS = [
    '#ff0000', '#007bff', '#28a745', '#ffc107', '#17a2b8', 
    '#6f42c1', '#fd7e14', '#e83e8c', '#20c997', '#343a40'
  ];

  document.addEventListener('DOMContentLoaded', () => {
    const savedKey = localStorage.getItem('ytApiKey');
    if (savedKey) {
      document.getElementById('apiKeyInput').value = savedKey;
    }
    renderList();
    updateChartSelectOptions();
    initChart();
    startAutoRefresh();
  });

  function saveApiKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if (!key) return alert('請輸入有效的 API Key');
    localStorage.setItem('ytApiKey', key);
    alert('API Key 已儲存！');
  }

  function getApiKey() {
    return localStorage.getItem('ytApiKey');
  }

  async function addTrackItem() {
    const apiKey = getApiKey();
    if (!apiKey) return alert('請先設定 API Key！');

    const input = document.getElementById('targetInput').value.trim();
    if (!input) return alert('請輸入網址或 ID');

    let videoId = extractVideoId(input);
    
    if (videoId) {
      await fetchVideoData(videoId, apiKey);
    } else {
      alert('無法解析影片 ID，請確認輸入的連結或 ID 是否正確');
    }
  }

  function extractVideoId(url) {
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null);
  }

  async function fetchVideoData(id, key, silent = false) {
    try {
      const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${id}&key=${key}`);
      const data = await res.json();
      
      if (!data.items || data.items.length === 0) {
        if (!silent) alert('找不到該影片數據');
        return;
      }

      const item = data.items[0];
      const now = new Date().toISOString();
      const currentViews = parseInt(item.statistics.viewCount || 0, 10);
      const likes = parseInt(item.statistics.likeCount || 0, 10);
      const comments = parseInt(item.statistics.commentCount || 0, 10);
      const channelTitle = item.snippet.channelTitle || '未知頻道';
      const publishedAt = item.snippet.publishedAt;

      const existingIndex = trackedItems.findIndex(i => i.id === item.id);
      
      if (existingIndex > -1) {
        trackedItems[existingIndex].title = item.snippet.title;
        trackedItems[existingIndex].thumbnail = item.snippet.thumbnails.medium ? item.snippet.thumbnails.medium.url : item.snippet.thumbnails.default.url;
        trackedItems[existingIndex].views = currentViews;
        trackedItems[existingIndex].likes = likes;
        trackedItems[existingIndex].comments = comments;
        trackedItems[existingIndex].channelTitle = channelTitle;
        trackedItems[existingIndex].publishedAt = publishedAt;
        trackedItems[existingIndex].updatedAt = now;
        
        if (!trackedItems[existingIndex].history) {
          trackedItems[existingIndex].history = [];
        }
        trackedItems[existingIndex].history.push({ timestamp: now, views: currentViews });
      } else {
        trackedItems.push({
          id: item.id,
          title: item.snippet.title,
          thumbnail: item.snippet.thumbnails.medium ? item.snippet.thumbnails.medium.url : item.snippet.thumbnails.default.url,
          views: currentViews,
          likes: likes,
          comments: comments,
          channelTitle: channelTitle,
          publishedAt: publishedAt,
          updatedAt: now,
          history: [{ timestamp: now, views: currentViews }]
        });
      }

      saveData();
      renderList();
      updateChartSelectOptions();
      updateChartAndAnalytics();
      document.getElementById('targetInput').value = '';
    } catch (e) {
      if (!silent) alert('獲取數據失敗，請檢查網路或 API Key');
    }
  }

  async function manualRefreshAll() {
    const apiKey = getApiKey();
    if (!apiKey) return alert('請先設定 API Key！');
    if (trackedItems.length === 0) return alert('尚無追蹤項目');

    const statusBar = document.getElementById('statusBar');
    statusBar.innerText = '手動即時更新中...';

    for (const item of trackedItems) {
      await fetchVideoData(item.id, apiKey, true);
    }

    const now = new Date().toLocaleTimeString();
    statusBar.innerText = `最後手動更新時間：${now}（每 10 分鐘自動刷新）`;
  }

  function saveData() {
    localStorage.setItem('trackedItems', JSON.stringify(trackedItems));
  }

  function deleteItem(id) {
    if (!confirm('確定要刪除此追蹤項目嗎？')) return;
    trackedItems = trackedItems.filter(item => item.id !== id);
    saveData();
    renderList();
    updateChartSelectOptions();
    updateChartAndAnalytics();
  }

  function calculateDailyAverage(views, publishedAt) {
    if (!publishedAt) return 0;
    const pubDate = new Date(publishedAt);
    const now = new Date();
    const diffTime = Math.max(now - pubDate, 1000 * 60 * 60 * 24);
    const diffDays = diffTime / (1000 * 60 * 60 * 24);
    return Math.round(views / diffDays);
  }

  function calculate24hGrowth(history) {
    if (!history || history.length < 2) return 0;
    const latest = history[history.length - 1];
    const latestTime = new Date(latest.timestamp).getTime();
    const target24hTime = latestTime - (24 * 60 * 60 * 1000);

    let closest = history[0];
    let minDiff = Math.abs(new Date(closest.timestamp).getTime() - target24hTime);

    for (let i = 1; i < history.length - 1; i++) {
      const diff = Math.abs(new Date(history[i].timestamp).getTime() - target24hTime);
      if (diff < minDiff) {
        minDiff = diff;
        closest = history[i];
      }
    }

    return Math.max(0, latest.views - closest.views);
  }

  function renderList() {
    const listEl = document.getElementById('trackList');
    const sortType = document.getElementById('sortSelect').value;

    let itemsToRender = [...trackedItems];

    if (sortType === 'views-desc') {
      itemsToRender.sort((a, b) => b.views - a.views);
    } else if (sortType === 'views-asc') {
      itemsToRender.sort((a, b) => a.views - b.views);
    } else if (sortType === 'title-asc') {
      itemsToRender.sort((a, b) => a.title.localeCompare(b.title));
    }

    if (itemsToRender.length === 0) {
      listEl.innerHTML = '<p style="color:#6c757d; text-align:center;">尚無追蹤項目</p>';
      return;
    }

    listEl.innerHTML = itemsToRender.map(item => {
      const likes = item.likes || 0;
      const comments = item.comments || 0;
      const views = item.views || 0;
      const engagementRate = views > 0 ? (((likes + comments) / views) * 100).toFixed(2) : '0.00';
      const dailyAvg = calculateDailyAverage(views, item.publishedAt);
      const growth24h = calculate24hGrowth(item.history);
      const publishedDateStr = item.publishedAt ? new Date(item.publishedAt).toLocaleDateString() : '未知';
      
      const daysPublished = item.publishedAt ? Math.floor((new Date() - new Date(item.publishedAt)) / (1000 * 60 * 60 * 24)) : 0;

      return `
        <div class="item-card">
          <div class="item-info">
            <img src="${item.thumbnail}" alt="縮圖">
            <div class="item-details">
              <a class="item-title" href="https://www.youtube.com/watch?v=${item.id}" target="_blank">${escapeHtml(item.title)}</a>
              <div class="channel-name">頻道：${escapeHtml(item.channelTitle || '未知')}</div>
              
              <div class="item-meta">
                <span>發布日期：${publishedDateStr} (${daysPublished} 天前)</span>
                <span>最後更新：${new Date(item.updatedAt).toLocaleTimeString()}</span>
              </div>

              <div class="stats-badge-container">
                <span class="badge badge-highlight">播放量：${views.toLocaleString()}</span>
                <span class="badge">按讚：${likes.toLocaleString()}</span>
                <span class="badge">留言：${comments.toLocaleString()}</span>
                <span class="badge">互動率：${engagementRate}%</span>
                <span class="badge">日均播放：${dailyAvg.toLocaleString()} / 天</span>
                <span class="badge">24h 增量：+${growth24h.toLocaleString()}</span>
              </div>
            </div>
          </div>
          <div class="action-buttons">
            <button class="btn-danger" onclick="deleteItem('${item.id}')">刪除</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function updateChartSelectOptions() {
    const select = document.getElementById('chartItemSelect');
    const currentValue = select.value;
    select.innerHTML = '<option value="ALL">顯示所有項目</option>';
    
    trackedItems.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.id;
      opt.textContent = item.title;
      select.appendChild(opt);
    });

    if (currentValue && (currentValue === 'ALL' || trackedItems.some(i => i.id === currentValue))) {
      select.value = currentValue;
    } else {
      select.value = 'ALL';
    }
  }

  function formatDateTime(isoString) {
    const d = new Date(isoString);
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const date = String(d.getDate()).padStart(2, '0');
    const hours = String(d.getHours()).padStart(2, '0');
    const minutes = String(d.getMinutes()).padStart(2, '0');
    return `${month}/${date} ${hours}:${minutes}`;
  }

  function filterSignificantHistory(history) {
    if (!history || history.length === 0) return [];
    if (history.length <= 2) return history;

    const filtered = [history[0]];
    let lastRecorded = history[0];

    for (let i = 1; i < history.length - 1; i++) {
      const current = history[i];
      const viewsDiff = Math.abs(current.views - lastRecorded.views);
      const minThreshold = Math.max(10, lastRecorded.views * 0.001);

      if (viewsDiff >= minThreshold) {
        filtered.push(current);
        lastRecorded = current;
      }
    }

    filtered.push(history[history.length - 1]);
    return filtered;
  }

  function initChart() {
    const ctx = document.getElementById('viewsChart').getContext('2d');
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: []
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            title: { display: true, text: '時間' }
          },
          y: {
            title: { display: true, text: '播放次數' },
            beginAtZero: false
          }
        }
      }
    });
    updateChartAndAnalytics();
  }

  function updateChartAndAnalytics() {
    updateChart();
    updateAnalytics();
  }

  function updateChart() {
    if (!chartInstance) return;
    const selectedId = document.getElementById('chartItemSelect').value;

    if (trackedItems.length === 0) {
      chartInstance.data.labels = [];
      chartInstance.data.datasets = [];
      chartInstance.update();
      return;
    }

    const processedItems = trackedItems.map(item => ({
      ...item,
      history: filterSignificantHistory(item.history)
    }));

    let allTimestamps = new Set();
    processedItems.forEach(item => {
      if (item.history) {
        item.history.forEach(h => allTimestamps.add(h.timestamp));
      }
    });

    const sortedTimestamps = Array.from(allTimestamps).sort((a, b) => new Date(a) - new Date(b));
    const labels = sortedTimestamps.map(t => formatDateTime(t));

    let datasets = [];

    if (selectedId === 'ALL') {
      datasets = processedItems.map((item, idx) => {
        const color = CHART_COLORS[idx % CHART_COLORS.length];
        const dataMap = new Map((item.history || []).map(h => [h.timestamp, h.views]));
        const data = sortedTimestamps.map(ts => dataMap.get(ts) ?? null);

        return {
          label: item.title,
          data: data,
          borderColor: color,
          backgroundColor: color,
          fill: false,
          tension: 0.1,
          spanGaps: true
        };
      });
    } else {
      const item = processedItems.find(i => i.id === selectedId);
      if (item && item.history) {
        const dataMap = new Map(item.history.map(h => [h.timestamp, h.views]));
        const data = sortedTimestamps.map(ts => dataMap.get(ts) ?? null);

        datasets.push({
          label: item.title,
          data: data,
          borderColor: '#ff0000',
          backgroundColor: 'rgba(255, 0, 0, 0.1)',
          fill: true,
          tension: 0.1,
          spanGaps: true
        });
      }
    }

    chartInstance.data.labels = labels;
    chartInstance.data.datasets = datasets;
    chartInstance.update();
  }

  function updateAnalytics() {
    const selectedId = document.getElementById('chartItemSelect').value;
    const totalItemsEl = document.getElementById('statTotalItems');
    const totalViewsEl = document.getElementById('statTotalViews');
    const hourlyGrowthEl = document.getElementById('statHourlyGrowth');
    const topItemEl = document.getElementById('statTopItem');

    if (trackedItems.length === 0) {
      totalItemsEl.innerText = '0';
      totalViewsEl.innerText = '0';
      hourlyGrowthEl.innerText = '0 / hr';
      topItemEl.innerText = '-';
      return;
    }

    if (selectedId === 'ALL') {
      totalItemsEl.innerText = trackedItems.length;
      
      const sumViews = trackedItems.reduce((acc, item) => acc + item.views, 0);
      totalViewsEl.innerText = sumViews.toLocaleString();

      let top = trackedItems.reduce((max, item) => item.views > max.views ? item : max, trackedItems[0]);
      topItemEl.innerText = top.title;

      let totalGrowth = 0;
      trackedItems.forEach(item => {
        totalGrowth += calculateHourlyGrowth(item);
      });
      hourlyGrowthEl.innerText = `+${Math.round(totalGrowth).toLocaleString()} / hr`;
    } else {
      const item = trackedItems.find(i => i.id === selectedId);
      if (item) {
        totalItemsEl.innerText = '1 (單項對比)';
        totalViewsEl.innerText = item.views.toLocaleString();
        topItemEl.innerText = item.title;
        
        const growth = calculateHourlyGrowth(item);
        hourlyGrowthEl.innerText = `+${Math.round(growth).toLocaleString()} / hr`;
      }
    }
  }

  function calculateHourlyGrowth(item) {
    if (!item.history || item.history.length < 2) return 0;
    
    const latest = item.history[item.history.length - 1];
    const latestTime = new Date(latest.timestamp).getTime();
    const oneHourAgoTime = latestTime - (60 * 60 * 1000);

    let previous = item.history[0];
    let minDiff = Math.abs(new Date(previous.timestamp).getTime() - oneHourAgoTime);

    for (let i = 1; i < item.history.length - 1; i++) {
      const diff = Math.abs(new Date(item.history[i].timestamp).getTime() - oneHourAgoTime);
      if (diff < minDiff) {
        minDiff = diff;
        previous = item.history[i];
      }
    }

    const timeDiffHours = (latestTime - new Date(previous.timestamp).getTime()) / (1000 * 60 * 60);
    const viewsDiff = latest.views - previous.views;

    if (timeDiffHours <= 0) return 0;
    return viewsDiff / timeDiffHours;
  }

  function startAutoRefresh() {
    setInterval(async () => {
      const apiKey = getApiKey();
      if (!apiKey || trackedItems.length === 0) return;

      const statusBar = document.getElementById('statusBar');
      statusBar.innerText = '自動更新中...';

      for (const item of trackedItems) {
        await fetchVideoData(item.id, apiKey, true);
      }
      
      const now = new Date().toLocaleTimeString();
      statusBar.innerText = `最後自動更新時間：${now}（每 10 分鐘自動刷新）`;
    }, AUTO_REFRESH_INTERVAL);
  }

  function exportData(format) {
    if (trackedItems.length === 0) return alert('目前沒有可匯出的數據');
    
    let dataStr = "";
    let fileName = `youtube_tracker_${new Date().toISOString().slice(0,10)}`;

    if (format === 'json') {
      dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(trackedItems, null, 2));
      fileName += ".json";
    } else if (format === 'csv') {
      let csvContent = "ID,Title,Channel,Views,Likes,Comments,PublishedAt,UpdatedAt\n";
      trackedItems.forEach(i => {
        csvContent += `"${i.id}","${i.title.replace(/"/g, '""')}","${(i.channelTitle||'').replace(/"/g, '""')}",${i.views},${i.likes||0},${i.comments||0},"${i.publishedAt||''}","${i.updatedAt}"\n`;
      });
      dataStr = "data:text/csv;charset=utf-8,\uFEFF" + encodeURIComponent(csvContent);
      fileName += ".csv";
    }

    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", fileName);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const importedData = JSON.parse(e.target.result);
        if (!Array.isArray(importedData)) {
          return alert('匯入失敗：JSON 格式不正確');
        }

        importedData.forEach(newItem => {
          if (!newItem.id || !newItem.title) return;
          const index = trackedItems.findIndex(i => i.id === newItem.id);
          if (index > -1) {
            trackedItems[index] = newItem;
          } else {
            trackedItems.push(newItem);
          }
        });

        saveData();
        renderList();
        updateChartSelectOptions();
        updateChartAndAnalytics();
        alert('數據匯入成功！');
      } catch (err) {
        alert('匯入失敗：無法解析 JSON 檔案');
      }
      event.target.value = '';
    };
    reader.readAsText(file);
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
</script>
