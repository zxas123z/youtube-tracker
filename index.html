<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube 數據追蹤器</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f5f5f7;
      color: #333;
      padding: 16px;
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    h2 {
      font-size: 1.2rem;
      margin-bottom: 12px;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background-color: #555;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #333;
    }
    .btn-red {
      background-color: #dc3545;
    }
    .btn-red:hover {
      background-color: #bd2130;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .video-item {
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
      position: relative;
    }
    .video-item img {
      width: 100px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
    }
    .video-info {
      flex: 1;
    }
    .video-title {
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }
    .video-channel {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 4px;
    }
    .video-meta {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 8px;
    }
    .stats-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.8rem;
    }
    .tag {
      background: #eef2ff;
      color: #3730a3;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .delete-btn {
      position: absolute;
      right: 12px;
      top: 12px;
      padding: 4px 8px;
      font-size: 0.75rem;
    }
    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    select {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    /* 修改容器高度：確保手機直向時圖表不會太扁 */
    .chart-container {
      position: relative;
      width: 100%;
      height: 380px;
    }
    @media (min-width: 768px) {
      .chart-container {
        height: 450px;
      }
    }
    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .analytic-card {
      background: #f8f9fa;
      border-left: 4px solid #dc3545;
      padding: 8px 12px;
      border-radius: 4px;
    }
    .analytic-label {
      font-size: 0.75rem;
      color: #666;
    }
    .analytic-value {
      font-size: 1.1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>API Key 設定</h2>
    <div class="input-group">
      <input type="text" id="apiKeyInput" placeholder="請輸入 YouTube API Key">
      <button onclick="saveApiKey()">儲存</button>
    </div>
  </div>

  <div class="card">
    <h2>新增追蹤影片</h2>
    <div class="input-group">
      <input type="text" id="targetInput" placeholder="輸入影片 ID 或 URL">
      <button onclick="addVideo()">新增</button>
    </div>
  </div>

  <div class="card">
    <h2>追蹤清單</h2>
    <div id="videoList"></div>
    <div class="btn-group">
      <button onclick="exportJSON()">匯出 JSON</button>
      <button onclick="exportCSV()">匯出 CSV</button>
      <button onclick="importJSON()">匯入 JSON</button>
      <input type="file" id="importFileInput" style="display: none;" onchange="handleFileImport(event)">
    </div>
  </div>

  <div class="card">
    <div class="chart-header">
      <h2>圖表分析</h2>
      <div style="display: flex; align-items: center; gap: 8px;">
        <label><input type="checkbox" id="includePublishDateCheckbox" onchange="updateChartAndAnalytics()" checked> 包含推出日期</label>
        <select id="chartItemSelect" onchange="updateChart()"></select>
      </div>
    </div>

    <div class="analytics-grid">
      <div class="analytic-card">
        <div class="analytic-label">總追蹤</div>
        <div class="analytic-value" id="statTotalTracked">0</div>
      </div>
      <div class="analytic-card">
        <div class="analytic-label">總播放量</div>
        <div class="analytic-value" id="statTotalViews">0</div>
      </div>
      <div class="analytic-card">
        <div class="analytic-label">每小時增長</div>
        <div class="analytic-value" id="statHourlyGrowth">+0 / hr</div>
      </div>
      <div class="analytic-card">
        <div class="analytic-label">最高播放</div>
        <div class="analytic-value" id="statTopVideo">-</div>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="viewsChart"></canvas>
    </div>
  </div>

  <script>
    const STORAGE_KEY_ITEMS = 'yt_tracked_items';
    const STORAGE_KEY_API = 'yt_api_key';

    const CHART_COLORS = [
      '#ff0000', '#007bff', '#28a745', '#ffc107', 
      '#17a2b8', '#6f42c1', '#fd7e14', '#e83e8c'
    ];

    let trackedItems = [];
    let apiKey = '';
    let chartInstance = null;

    window.onload = function() {
      apiKey = localStorage.getItem(STORAGE_KEY_API) || '';
      document.getElementById('apiKeyInput').value = apiKey;

      const savedData = localStorage.getItem(STORAGE_KEY_ITEMS);
      if (savedData) {
        try {
          trackedItems = JSON.parse(savedData);
        } catch(e) {
          trackedItems = [];
        }
      }

      initChart();
      renderList();
      updateChartSelectOptions();
      updateChartAndAnalytics();
    };

    function saveApiKey() {
      apiKey = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem(STORAGE_KEY_API, apiKey);
      alert('API Key 已儲存');
    }

    function extractVideoId(input) {
      input = input.trim();
      if (input.length === 11) return input;
      const match = input.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : null;
    }

    async function addVideo() {
      if (!apiKey) {
        alert('請先設定 API Key');
        return;
      }
      const input = document.getElementById('targetInput').value;
      const videoId = extractVideoId(input);
      if (!videoId) {
        alert('無效的影片 ID 或網址');
        return;
      }

      await fetchVideoData(videoId, apiKey);
    }

    async function fetchVideoData(id, key, silent = false) {
      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${id}&key=${key}`);
        const data = await res.json();
        
        if (data.error) {
          if (!silent) alert(`API 錯誤 (${data.error.code})：${data.error.message}`);
          return;
        }

        if (!data.items || data.items.length === 0) {
          if (!silent) alert('找不到該影片數據，請確認 ID 是否正確');
          return;
        }

        const item = data.items[0];
        const now = new Date().toISOString();
        const currentViews = parseInt(item.statistics.viewCount || 0, 10);
        const likes = parseInt(item.statistics.likeCount || 0, 10);
        const comments = parseInt(item.statistics.commentCount || 0, 10);
        const channelTitle = item.snippet.channelTitle || '未知頻道';
        const publishedAt = item.snippet.publishedAt;

        const existingIndex = trackedItems.findIndex(i => i.id === item.id);
        
        if (existingIndex > -1) {
          trackedItems[existingIndex].title = item.snippet.title;
          trackedItems[existingIndex].thumbnail = item.snippet.thumbnails.medium ? item.snippet.thumbnails.medium.url : item.snippet.thumbnails.default.url;
          trackedItems[existingIndex].views = currentViews;
          trackedItems[existingIndex].likes = likes;
          trackedItems[existingIndex].comments = comments;
          trackedItems[existingIndex].channelTitle = channelTitle;
          trackedItems[existingIndex].publishedAt = publishedAt;
          trackedItems[existingIndex].updatedAt = now;
          
          if (!trackedItems[existingIndex].history) trackedItems[existingIndex].history = [];
          trackedItems[existingIndex].history.push({ timestamp: now, views: currentViews });
        } else {
          trackedItems.push({
            id: item.id,
            title: item.snippet.title,
            thumbnail: item.snippet.thumbnails.medium ? item.snippet.thumbnails.medium.url : item.snippet.thumbnails.default.url,
            views: currentViews,
            likes: likes,
            comments: comments,
            channelTitle: channelTitle,
            publishedAt: publishedAt,
            updatedAt: now,
            history: [{ timestamp: now, views: currentViews }]
          });
        }

        saveData();
        renderList();
        if (typeof updateChartSelectOptions === 'function') updateChartSelectOptions();
        
        try {
          if (typeof updateChart === 'function') updateChart();
          if (typeof updateAnalytics === 'function') updateAnalytics();
        } catch (chartErr) {
          console.error("更新圖表或分析時出錯：", chartErr);
        }

        document.getElementById('targetInput').value = '';
      } catch (e) {
        if (!silent) alert(`獲取數據失敗：${e.message}`);
      }
    }

    function removeItem(id) {
      if (confirm('確定要刪除這支影片的追蹤數據嗎？')) {
        trackedItems = trackedItems.filter(i => i.id !== id);
        saveData();
        renderList();
        updateChartSelectOptions();
        updateChartAndAnalytics();
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(trackedItems));
    }

    function renderList() {
      const container = document.getElementById('videoList');
      container.innerHTML = '';

      if (trackedItems.length === 0) {
        container.innerHTML = '<div style="color: #999; text-align: center; padding: 20px;">尚無追蹤項目</div>';
        return;
      }

      trackedItems.forEach(item => {
        const pubDateStr = item.publishedAt ? new Date(item.publishedAt).toLocaleDateString() : '未知';
        const lastUpdateStr = item.updatedAt ? new Date(item.updatedAt).toLocaleTimeString() : '未知';

        const div = document.createElement('div');
        div.className = 'video-item';
        div.innerHTML = `
          <img src="${item.thumbnail}" alt="thumb">
          <div class="video-info">
            <div class="video-title">${item.title}</div>
            <div class="video-channel">${item.channelTitle}</div>
            <div class="video-meta">發布日期：${pubDateStr} | 最後更新：${lastUpdateStr}</div>
            <div class="stats-tags">
              <span class="tag">觀看：${item.views.toLocaleString()}</span>
              <span class="tag">讚：${item.likes.toLocaleString()}</span>
            </div>
          </div>
          <button class="delete-btn btn-red" onclick="removeItem('${item.id}')">刪除</button>
        `;
        container.appendChild(div);
      });
    }

    function updateChartSelectOptions() {
      const select = document.getElementById('chartItemSelect');
      const currentVal = select.value;
      select.innerHTML = '<option value="ALL">顯示所有項目</option>';

      trackedItems.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = item.title;
        select.appendChild(opt);
      });

      if (currentVal && Array.from(select.options).some(o => o.value === currentVal)) {
        select.value = currentVal;
      }
    }

    function initChart() {
      const ctx = document.getElementById('viewsChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: []
        },
        options: {
          responsive: true,
          maintainAspectRatio: false, // 禁止強制固定比例，讓 CSS 高度生效
          scales: {
            x: {
              title: { display: true, text: '時間' }
            },
            y: {
              title: { display: true, text: '播放次數' },
              beginAtZero: true
            }
          }
        }
      });
    }

    function updateChartAndAnalytics() {
      updateChart();
      updateAnalytics();
    }

    function updateChart() {
      if (!chartInstance) return;
      const selectedId = document.getElementById('chartItemSelect').value;
      const includePublishDate = document.getElementById('includePublishDateCheckbox').checked;

      if (trackedItems.length === 0) {
        chartInstance.data.labels = [];
        chartInstance.data.datasets = [];
        chartInstance.update();
        return;
      }

      // 1. 處理數據並紀錄推出時間點與實際紀錄時間點
      const processedItems = trackedItems.map(item => {
        let combinedHistory = [...(item.history || [])];
        let pubTimeISO = null;

        if (includePublishDate && item.publishedAt) {
          const d = new Date(item.publishedAt);
          d.setSeconds(0, 0);
          pubTimeISO = d.toISOString();
        }

        return { ...item, combinedHistory, pubTimeISO };
      });

      // 2. 找出全域最新時間戳記
      let maxTimestamp = 0;
      processedItems.forEach(item => {
        item.combinedHistory.forEach(h => {
          const t = new Date(h.timestamp).getTime();
          if (t > maxTimestamp) maxTimestamp = t;
        });
      });

      // 3. 建立時間地圖與統一時間集合
      const timeSet = new Set();
      const maxDate = new Date(maxTimestamp);
      maxDate.setSeconds(0, 0);
      const maxMinISO = maxDate.toISOString();

      processedItems.forEach(item => {
        item.historyMap = new Map();
        item.combinedHistory.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

        // 找出第一次實際紀錄的時間
        let firstRealTimeISO = null;
        if (item.combinedHistory.length > 0) {
          const fd = new Date(item.combinedHistory[0].timestamp);
          fd.setSeconds(0, 0);
          firstRealTimeISO = fd.toISOString();
        }

        // 若勾選推出日期且有發布時間
        if (item.pubTimeISO) {
          if (!firstRealTimeISO || item.pubTimeISO <= firstRealTimeISO) {
            item.historyMap.set(item.pubTimeISO, 0);
            timeSet.add(item.pubTimeISO);
          }
        }

        // 紀錄實際抓到的觀看量歷史點
        item.combinedHistory.forEach(h => {
          const d = new Date(h.timestamp);
          d.setSeconds(0, 0);
          const minISO = d.toISOString();
          item.historyMap.set(minISO, h.views);
          timeSet.add(minISO);
        });

        // 補齊最後一個最新時間點，使右側數據對齊
        const lastViews = item.combinedHistory.length > 0 
          ? item.combinedHistory[item.combinedHistory.length - 1].views 
          : 0;

        if (!item.historyMap.has(maxMinISO)) {
          item.historyMap.set(maxMinISO, lastViews);
        }
        timeSet.add(maxMinISO);
      });

      // 4. X 軸標籤排序
      const sortedISOList = Array.from(timeSet).sort((a, b) => new Date(a) - new Date(b));
      const labels = sortedISOList.map(t => formatDateTime(t));

      // 5. 繪製折線圖
      const itemsToDisplay = selectedId === 'ALL' 
        ? processedItems 
        : processedItems.filter(i => i.id === selectedId);

      const datasets = itemsToDisplay.map((item, idx) => {
        const color = selectedId === 'ALL' 
          ? CHART_COLORS[idx % CHART_COLORS.length] 
          : '#ff0000';

        let lastVal = null;
        let hasReachedFirstRecord = false;

        let firstRecordISO = null;
        if (item.combinedHistory && item.combinedHistory.length > 0) {
          const fd = new Date(item.combinedHistory[0].timestamp);
          fd.setSeconds(0, 0);
          firstRecordISO = fd.toISOString();
        }

        const alignedData = sortedISOList.map(iso => {
          if (item.historyMap.has(iso)) {
            const val = item.historyMap.get(iso);
            if (iso === firstRecordISO) {
              hasReachedFirstRecord = true;
            }
            lastVal = val;
            return val;
          }

          // 推出日與第一次紀錄之間補 null，讓 Chart.js 自動拉直線
          if (item.pubTimeISO && iso > item.pubTimeISO && !hasReachedFirstRecord) {
            return null;
          }

          return lastVal;
        });

        return {
          label: item.title,
          data: alignedData,
          borderColor: color,
          backgroundColor: selectedId === 'ALL' ? color : 'rgba(255, 0, 0, 0.1)',
          fill: selectedId !== 'ALL',
          tension: 0.1,
          spanGaps: true // 跨越 null 點，將 0 與第一次紀錄點拉出直線
        };
      });

      chartInstance.data.labels = labels;
      chartInstance.data.datasets = datasets;
      chartInstance.update();
    }

    function updateAnalytics() {
      document.getElementById('statTotalTracked').textContent = trackedItems.length;

      let totalViews = 0;
      let topVideo = null;
      let maxViews = -1;

      trackedItems.forEach(item => {
        totalViews += (item.views || 0);
        if (item.views > maxViews) {
          maxViews = item.views;
          topVideo = item;
        }
      });

      document.getElementById('statTotalViews').textContent = totalViews.toLocaleString();
      document.getElementById('statTopVideo').textContent = topVideo ? topVideo.title : '-';

      // 簡化計算每小時增長
      let totalGrowth = 0;
      trackedItems.forEach(item => {
        if (item.history && item.history.length >= 2) {
          const first = item.history[0];
          const last = item.history[item.history.length - 1];
          const hours = (new Date(last.timestamp) - new Date(first.timestamp)) / (1000 * 60 * 60);
          if (hours > 0) {
            totalGrowth += (last.views - first.views) / hours;
          }
        }
      });

      document.getElementById('statHourlyGrowth').textContent = `+${Math.round(totalGrowth).toLocaleString()} / hr`;
    }

    function formatDateTime(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const hours = String(d.getHours()).padStart(2, '0');
      const minutes = String(d.getMinutes()).padStart(2, '0');
      return `${month}/${day} ${hours}:${minutes}`;
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(trackedItems, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `youtube_tracking_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    }

    function exportCSV() {
      let csv = 'ID,Title,Views,Likes,Comments,PublishedAt,UpdatedAt\n';
      trackedItems.forEach(i => {
        csv += `"${i.id}","${i.title.replace(/"/g, '""')}",${i.views},${i.likes},${i.comments},"${i.publishedAt}","${i.updatedAt}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `youtube_tracking_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
    }

    function importJSON() {
      document.getElementById('importFileInput').click();
    }

    function handleFileImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            trackedItems = imported;
            saveData();
            renderList();
            updateChartSelectOptions();
            updateChartAndAnalytics();
            alert('成功匯入數據');
          } else {
            alert('JSON 格式不正確');
          }
        } catch(err) {
          alert('解析 JSON 檔案失敗');
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
